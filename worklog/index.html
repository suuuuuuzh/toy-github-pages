<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工作日志</title>
  <style>
    :root {
      --bg: #f8fafc; --panel: #ffffff; --text: #1e293b; --muted: #64748b; --border: #e2e8f0;
      --primary: #2563eb; --done: #16a34a; --ongoing: #d97706; --waiting: #9333ea; --late: #dc2626;
      --c-sound: #7c3aed; --c-prod: #2563eb; --c-study: #059669; --c-other: #64748b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a; --panel: #1e293b; --text: #e2e8f0; --muted: #94a3b8; --border: #334155;
        --primary: #60a5fa; --done: #4ade80; --ongoing: #fbbf24; --waiting: #c084fc; --late: #f87171;
        --c-sound: #a78bfa; --c-prod: #60a5fa; --c-study: #34d399; --c-other: #94a3b8;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.55;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif; }
    .container { max-width: 900px; margin: 0 auto; padding: 24px 16px 64px; }
    header { border-bottom: 2px solid var(--primary); padding-bottom: 12px; margin-bottom: 16px; }
    h1 { margin: 0 0 10px; font-size: 24px; }
    .range { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
    .range input { font: inherit; padding: 4px 6px; border: 1px solid var(--border); border-radius: 6px;
      background: var(--panel); color: var(--text); }
    button { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 6px; cursor: pointer;
      border: 1px solid var(--border); background: var(--panel); color: var(--text); }
    button.on { background: var(--primary); border-color: var(--primary); color: #fff; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 14px 0; }
    .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
    .stat .n { font-size: 22px; font-weight: 600; }
    .stat .l { font-size: 12px; color: var(--muted); }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 14px; }
    .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .day { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
    .day h3 { margin: 0; padding: 8px 12px; font-size: 14px; border-bottom: 1px solid var(--border); color: var(--muted); }
    .row { display: flex; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); align-items: flex-start; }
    .row:last-child { border-bottom: 0; }
    .row .body { flex: 1; min-width: 0; }
    .proj { font-weight: 600; }
    .note { font-size: 12px; color: var(--muted); }
    .tag { flex: none; font-size: 11px; padding: 1px 7px; border-radius: 999px; color: #fff; white-space: nowrap; margin-top: 2px; }
    .tag.sound { background: var(--c-sound); } .tag.prod { background: var(--c-prod); } .tag.study { background: var(--c-study); } .tag.other { background: var(--c-other); }
    .st { flex: none; font-size: 12px; white-space: nowrap; margin-top: 2px; }
    .st.done { color: var(--done); } .st.ongoing { color: var(--ongoing); } .st.open { color: var(--primary); }
    .st.waiting { color: var(--waiting); } .late { color: var(--late); font-weight: 600; }
    h2 { font-size: 16px; margin: 18px 0 8px; }
    .empty { color: var(--muted); font-size: 14px; padding: 10px 0; }
    textarea { width: 100%; min-height: 420px; font: 14px/1.6 inherit; font-family: inherit; padding: 12px;
      border: 1px solid var(--border); border-radius: 10px; background: var(--panel); color: var(--text); }
    .report-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; font-size: 13px; color: var(--muted); }
    .hidden { display: none; }
    .ai { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; white-space: nowrap; }
    .chips { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 4px; }
    .chips button { flex: none; }
    h2.big { font-size: 18px; margin-top: 14px; }
    .num { flex: none; width: 1.6em; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
    .sub { padding: 6px 12px; font-size: 12px; font-weight: 600; color: var(--muted); background: var(--bg); border-bottom: 1px solid var(--border); }
    header .tabs { margin: 4px 0 0; }
    .range { margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>工作日志</h1>
      <p class="note">已停用（10/6 起）：日志和待办已搬到私密的「水素工作台」，这里只作存档。</p>
      <nav class="tabs" id="tabs"></nav>
    </header>

    <!-- 按天 -->
    <section id="view-day">
      <div class="range">
        <button id="d-prev">‹ 前一天</button>
        <input type="date" id="day" />
        <button id="d-next">后一天 ›</button>
        <button id="d-today">今天</button>
      </div>
      <div class="chips" id="day-chips"></div>
      <div id="day-body"></div>
    </section>

    <!-- 按工作（声音后期 / 制片 / 留学） -->
    <section id="view-cat" class="hidden">
      <div class="range" id="range-box">
        <span>周期</span>
        <input type="date" id="from" /> <span>至</span> <input type="date" id="to" />
        <button id="cur">最近两周</button>
        <button id="prev">上一个两周</button>
        <button id="all">全部</button>
      </div>
      <div class="filters">
        <button data-group="day" class="on">按天</button>
        <button data-group="project">按项目</button>
      </div>
      <div id="cat-body"></div>
    </section>

    <!-- 待办 -->
    <section id="view-todo" class="hidden"></section>

    <!-- 双周汇报 -->
    <section id="view-report" class="hidden">
      <div class="report-bar">
        <span id="report-range"></span>
        <label><input type="checkbox" id="with-dates" checked /> 带日期</label>
        <button id="copy">复制汇报</button>
        <span id="copy-status"></span>
      </div>
      <div class="chips" id="report-projects"></div>
      <textarea id="report" spellcheck="false"></textarea>
    </section>
  </div>

  <script src="data.js"></script>
  <script src="report.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const catName = Object.fromEntries(categories.map((c) => [c.key, c.name]));
    const statusText = { done: "已完成", ongoing: "进行中", open: "待做", waiting: "等待中" };
    const esc = (s) => String(s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const iso = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    const addDays = (s, n) => { const d = new Date(s + "T00:00:00"); d.setDate(d.getDate() + n); return iso(d); };
    const md = (s) => s ? Number(s.slice(5, 7)) + "/" + Number(s.slice(8, 10)) : "";
    const dot = (s) => s.replace(/-/g, ".");
    const weekday = (s) => "日一二三四五六"[new Date(s + "T00:00:00").getDay()];
    const today = iso(new Date());
    const planDay = (t) => t.plan || t.due;

    // ---- 顶部标签：按天 / 各项工作 / 待办 / 双周汇报 ----
    const TABS = [{ key: "day", name: "按天" }]
      .concat(categories.map((c) => ({ key: "cat:" + c.key, name: c.name })))
      .concat([{ key: "todo", name: "待办" }, { key: "report", name: "廿一进展" }]);
    let tab = "day", group = "day";

    // 每个标签有自己的网址（如 #report、#todo），可以单独收藏 / 加到程序坞
    const HASH = { day: "day", "cat:sound": "sound", "cat:prod": "prod", "cat:study": "study", "cat:other": "other", todo: "todo", report: "report" };
    function show(t) {
      tab = t;
      try { history.replaceState(null, "", "#" + (HASH[t] || t)); } catch (e) {}
      $("tabs").innerHTML = TABS.map((x) => `<button data-tab="${x.key}" class="${x.key === tab ? "on" : ""}">${x.name}</button>`).join("");
      $("tabs").querySelectorAll("button").forEach((b) => (b.onclick = () => show(b.dataset.tab)));
      const view = tab.startsWith("cat:") ? "cat" : tab;
      ["day", "cat", "todo", "report"].forEach((v) => $("view-" + v).classList.toggle("hidden", v !== view));
      if (view === "report") $("view-report").prepend($("range-box"));
      if (view === "cat") $("view-cat").prepend($("range-box"));
      render();
    }

    // ---- 公用 ----
    function logRow(l, n, withCat) {
      return `<div class="row"><span class="num">${n}.</span>
        ${withCat ? `<span class="tag ${l.cat}">${catName[l.cat]}</span>` : ""}
        <div class="body"><span class="proj">${esc(l.project)}</span>　${esc(l.text)}${l.src === "claude" ? ' <span class="ai">Claude 补充</span>' : ""}</div>
        <span class="st ${l.status}">${statusText[l.status] || ""}</span></div>`;
    }
    function todoRow(t, withCat = true) {
      const late = t.status !== "done" && t.due && t.due < today;
      const when = t.status === "done" ? (t.doneDate ? md(t.doneDate) + " 完成" : "")
        : t.due ? `<span class="${late ? "late" : ""}">${md(t.due)} 前${late ? "（已过期）" : ""}</span>` : "";
      return `<div class="row">${withCat ? `<span class="tag ${t.cat}">${catName[t.cat]}</span>` : ""}
        <div class="body"><span class="proj">${esc(t.project)}</span>　${esc(t.text)}
        ${t.note ? `<div class="note">${esc(t.note)}</div>` : ""}${when ? `<div class="note">${when}</div>` : ""}</div>
        <span class="st ${t.status}">${t.owner !== "我" ? t.owner + " · " : ""}${statusText[t.status]}</span></div>`;
    }
    const box = (title, inner) => `<h2>${title}</h2>` + (inner ? `<div class="day">${inner}</div>` : '<p class="empty">暂无</p>');

    // ---- 按天 ----
    function setDay(d) { $("day").value = d; render(); }
    $("d-prev").onclick = () => setDay(addDays($("day").value, -1));
    $("d-next").onclick = () => setDay(addDays($("day").value, 1));
    $("d-today").onclick = () => setDay(today);
    $("day").onchange = render;

    function renderDay() {
      const d = $("day").value || today;
      const days = [...new Set(logs.map((l) => l.date).concat(todos.map(planDay).filter(Boolean)))].sort().reverse().slice(0, 14);
      $("day-chips").innerHTML = days.map((x) => {
        const n = logs.filter((l) => l.date === x).length;
        return `<button data-d="${x}" class="${x === d ? "on" : ""}">${md(x)} 周${weekday(x)}${n ? ` · ${n}` : ""}</button>`;
      }).join("");
      $("day-chips").querySelectorAll("button").forEach((b) => (b.onclick = () => setDay(b.dataset.d)));

      const plan = todos.filter((t) => planDay(t) === d);
      const carry = d === today ? todos.filter((t) => t.status !== "done" && planDay(t) !== d) : [];
      const done = logs.filter((l) => l.date === d);
      let html = `<h2 class="big">${dot(d)}（周${weekday(d)}）${d === today ? "· 今天" : ""}</h2>`;
      html += box(`计划（${plan.length}）`, plan.map((t) => todoRow(t)).join(""));
      let n = 0, inner = "";
      categories.forEach((c) => {
        const ls = done.filter((l) => l.cat === c.key);
        if (!ls.length) return;
        inner += `<div class="sub">${c.name}（${ls.length}）</div>` + ls.map((l) => logRow(l, ++n, false)).join("");
      });
      html += box(`工作总结（${done.length}）`, inner);
      if (carry.length) html += box(`其他未完成待办（${carry.length}）`, carry.map((t) => todoRow(t)).join(""));
      $("day-body").innerHTML = html;
    }

    // ---- 按工作 ----
    function setRange(from, to) { $("from").value = from; $("to").value = to; render(); }
    $("cur").onclick = () => setRange(addDays(today, -13), today);
    $("prev").onclick = () => setRange(addDays(today, -27), addDays(today, -14));
    $("all").onclick = () => setRange(logs.map((l) => l.date).sort()[0] || today, today);
    $("from").onchange = $("to").onchange = render;
    document.querySelectorAll("[data-group]").forEach((b) => (b.onclick = () => {
      group = b.dataset.group;
      document.querySelectorAll("[data-group]").forEach((x) => x.classList.toggle("on", x === b));
      render();
    }));
    const inRange = () => logs.filter((l) => (!$("from").value || l.date >= $("from").value) && (!$("to").value || l.date <= $("to").value));

    function renderCat(key) {
      const ls = inRange().filter((l) => l.cat === key);
      const open = todos.filter((t) => t.cat === key && t.status !== "done");
      let html = box(`待办（${open.length}）`, open.map((t) => todoRow(t, false)).join(""));
      const groups = {};
      ls.forEach((l) => (groups[group === "day" ? l.date : l.project] = groups[group === "day" ? l.date : l.project] || []).push(l));
      const keys = Object.keys(groups);
      if (group === "day") keys.sort().reverse();
      html += `<h2>工作记录（${ls.length}）</h2>`;
      if (!keys.length) html += '<p class="empty">这个周期里还没有记录。</p>';
      keys.forEach((k) => {
        const title = group === "day" ? `${dot(k)}（周${weekday(k)}）` : k;
        const rows = groups[k].sort((a, b) => a.date.localeCompare(b.date)).map((l, i) =>
          group === "day" ? logRow(l, i + 1, false)
            : logRow(Object.assign({}, l, { project: md(l.date) }), i + 1, false)).join("");
        html += `<div class="day"><h3>${esc(title)} · ${groups[k].length} 项</h3>${rows}</div>`;
      });
      $("cat-body").innerHTML = html;
    }

    // ---- 待办 ----
    function renderTodo() {
      const order = { open: 0, waiting: 1, done: 2 };
      const sorted = (arr) => arr.sort((a, b) => order[a.status] - order[b.status] || (a.due || "9").localeCompare(b.due || "9"));
      let html = '<p class="note">待办以<a href="https://claude.ai/artifact/5fMqEWp9C1eQNVCMNXeMVZ" target="_blank" rel="noopener">水素的待办板</a>为准（打勾、改日期都在那里），这里是工作类待办的镜像，每天早上同步一次。</p>';
      categories.forEach((c) => {
        const arr = todos.filter((t) => t.cat === c.key && t.status !== "done");
        if (arr.length) html += box(`${c.name}（${arr.length}）`, sorted(arr).map((t) => todoRow(t, false)).join(""));
      });
      $("view-todo").innerHTML = html;
    }

    // ---- 双周汇报 ----
    $("with-dates").onchange = render;
    // 双周汇报只包含 reportCats 里的分类（在 data.js 里设置），目前只汇报制片
    // 不在 reportProjects 里的项目默认不进汇报；汇报页上可以临时点选
    const skip = new Set(typeof reportProjects === "undefined" ? [] :
      logs.concat(todos).map((x) => x.project).filter((p) => !reportProjects.includes(p)));
    function renderReport() {
      const cats = typeof reportCats !== "undefined" ? reportCats : categories.map((c) => c.key);
      const single = cats.length === 1;
      const all = inRange().filter((l) => cats.includes(l.cat));
      const projs = [...new Set(all.map((l) => l.project))];
      $("report-projects").innerHTML = projs.map((p) =>
        `<button data-p="${esc(p)}" class="${skip.has(p) ? "" : "on"}">${skip.has(p) ? "" : "✓ "}${esc(p)}</button>`).join("");
      $("report-projects").querySelectorAll("button").forEach((b) => (b.onclick = () => {
        const p = b.dataset.p; skip.has(p) ? skip.delete(p) : skip.add(p); render();
      }));
      $("report").value = buildReport({ logs, todos, reportCats: cats, from: $("from").value, to: $("to").value,
        skip, withDates: $("with-dates").checked });
    }
    $("copy").onclick = async () => {
      try { await navigator.clipboard.writeText($("report").value); }
      catch (e) { $("report").select(); document.execCommand("copy"); }
      $("copy-status").textContent = "已复制";
      setTimeout(() => ($("copy-status").textContent = ""), 2000);
    };

    function render() {
      if (tab === "day") renderDay();
      else if (tab.startsWith("cat:")) renderCat(tab.slice(4));
      else if (tab === "todo") renderTodo();
      else renderReport();
    }

    $("from").value = addDays(today, -13); $("to").value = today; $("day").value = today;
    const fromHash = Object.keys(HASH).find((k) => "#" + HASH[k] === location.hash);
    show(fromHash || "day");
    window.addEventListener("hashchange", () => {
      const k = Object.keys(HASH).find((k) => "#" + HASH[k] === location.hash);
      if (k && k !== tab) show(k);
    });
  </script>
</body>
</html>
