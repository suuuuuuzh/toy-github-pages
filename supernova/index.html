<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>supernova studio · 报销单</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>supernova studio · 报销单</h1>
      <div class="meta">
        <span>报销人：<b>水素</b></span>
        <span>业务：<b>留学</b></span>
      </div>
      <div class="meta" id="grand-strip" style="margin-top:10px;font-size:15px;"></div>
    </header>

    <section class="summary-cards" id="report-cards"></section>

    <p style="margin:6px 0 0;">
      <button id="new-sheet-btn" class="btn-outline">＋ 新建一张报销单</button>
      <span id="new-sheet-status" class="muted" style="font-size:12px;margin-left:8px;"></span>
    </p>

    <section id="archived-section" style="display:none;margin-top:18px;">
      <button id="archived-toggle" class="cat-head"><span class="cat-caret">▸</span><span class="cat-name">已结算归档</span><span class="cat-meta" id="archived-meta"></span></button>
      <div id="archived-cards" class="summary-cards" style="display:none;margin-top:10px;"></div>
    </section>

    <section>
      <p class="muted" style="font-size:13px;">
        所有报销单合并按<b>一次报销</b>结算，上面的合计会根据每张表的内容自动计算。
        发票托管在网站上，每张表里可上传、挂票、下载打包。
      </p>
    </section>
  </div>

  <script src="site-config.js"></script>
  <script src="reports.js"></script>
  <script src="upload.js"></script>
  <script>
    // 卡片 + 总账（预支 / 实际花销 / 差额）都从 reportRegistry 自动算
    (function () {
      const fmt = (n) => Number(n || 0).toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const cards = document.getElementById("report-cards");
      const colors = ["#2563eb", "#16a34a", "#d97706", "#7c3aed", "#0891b2"];
      const card = (r, i, dim) => `
        <a class="card" href="${r.page}" style="text-decoration:none;color:inherit;display:block${dim ? ";opacity:.72" : ""}">
          <div class="label">${r.title}${dim ? ' <span class="muted">· 已结算</span>' : ""}</div>
          <div class="value" style="color:${dim ? "#64748b" : colors[i % colors.length]}">${r.period}</div>
          <div class="sub">${r.count} 笔 · 合计 ¥${fmt(r.total)} · 点击查看 →</div>
        </a>`;
      const active = reportRegistry.filter((r) => !r.archived);
      const archived = reportRegistry.filter((r) => r.archived);
      cards.innerHTML = active.map((r, i) => card(r, i, false)).join("");

      // 已结算的收进折叠区，不计入上面的总账
      if (archived.length) {
        const sec = document.getElementById("archived-section");
        sec.style.display = "block";
        const archTotal = archived.reduce((s, r) => s + Number(r.total || 0), 0);
        document.getElementById("archived-meta").textContent =
          archived.length + " 张 · 合计 ¥" + fmt(archTotal);
        const box = document.getElementById("archived-cards");
        box.innerHTML = archived.map((r, i) => card(r, i, true)).join("");
        const tog = document.getElementById("archived-toggle");
        tog.addEventListener("click", () => {
          const open = box.style.display !== "none";
          box.style.display = open ? "none" : "grid";
          tog.querySelector(".cat-caret").textContent = open ? "▸" : "▾";
        });
      }

      const loan = active.reduce((s, r) => s + Number(r.loan || 0), 0);
      const total = active.reduce((s, r) => s + Number(r.total || 0), 0);
      const diff = total - loan;
      document.getElementById("grand-strip").innerHTML =
        `<span>预支合计：<b>¥${fmt(loan)}</b></span>` +
        `<span>实际花销合计：<b>¥${fmt(total)}</b></span>` +
        `<span>差额：<b style="color:${diff > 0 ? "#16a34a" : diff < 0 ? "#dc2626" : "inherit"}">¥${fmt(Math.abs(diff))}</b>` +
        `<span class="muted">${diff > 0.004 ? "（应补付报销人）" : diff < -0.004 ? "（报销人退回）" : "（两清）"}</span></span>`;

      // 新建报销单：直接提交一个新 data 文件 + 更新登记表（需要 GitHub 令牌）
      const btn = document.getElementById("new-sheet-btn");
      const status = document.getElementById("new-sheet-status");
      btn.addEventListener("click", async () => {
        if (!askGhToken(false)) { status.textContent = "需要 GitHub 令牌才能新建。"; return; }
        const name = (prompt("新报销单名称（比如：7月拍摄、日常）") || "").trim();
        if (!name) return;
        const period = (prompt("周期（比如：2026年7月，可留空）") || "").trim();
        const slug = "s" + Date.now().toString(36);
        const q = (s) => s.replace(/"/g, "");
        const dataText =
          "// 报销单 · " + q(name) + "\n" +
          "const reportInfo = {\n" +
          '  reportTitle: "报销单 · ' + q(name) + '",\n' +
          '  company: "supernova studio",\n' +
          '  submitter: "水素",\n  project: "留学业务",\n  department: "",\n' +
          '  period: "' + q(period) + '",\n  reportDate: "",\n  loan: 0,\n};\n\n' +
          'const categoryOptions = ["交通费", "住宿费", "餐费", "差旅费", "市场推广", "广告投放", "办公用品", "软件订阅", "场地租赁", "业务招待费", "快递费", "外包/顾问费", "活动/展会", "其他"];\n\n' +
          "const expenseItems = [];\n\nconst tpiaoList = [];\n";
        const newReg = reportRegistry.concat([{ slug: slug, title: "报销单 · " + q(name), period: q(period), page: "sheet.html?r=" + slug, count: 0, total: 0, loan: 0, archived: false }]);
        const regText =
          "// 报销单登记表：首页卡片和合计从这里来。新建报销单会自动追加；count/total 在我固化数据时更新。\n" +
          "const reportRegistry = " + JSON.stringify(newReg, null, 1) + ";\n";
        try {
          status.textContent = "正在创建…";
          await commitTextFilesToRepo(
            [
              { path: "supernova/data-" + slug + ".js", text: dataText },
              { path: "supernova/reports.js", text: regText },
            ],
            "新建报销单：" + name
          );
          status.textContent = "已创建 ✓ 部署约需 2-3 分钟，之后刷新首页就能看到新卡片。";
        } catch (e) {
          status.textContent = "创建失败：" + e.message;
        }
      });
    })();
  </script>
</body>
</html>
