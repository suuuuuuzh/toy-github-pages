name: Update extra invoice manifest

on:
  push:
    branches: [main]
    paths:
      - "expense-report/invoices/extra/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extra-invoices-manifest
  cancel-in-progress: false

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install PyMuPDF (best-effort PDF metadata)
        run: pip install --quiet pymupdf || true
      - name: Regenerate invoices-extra.js
        run: python3 expense-report/tools/gen_extra_manifest.py
      - name: Commit manifest if changed
        run: |
          if ! git diff --quiet -- expense-report/invoices-extra.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add expense-report/invoices-extra.js
            git commit -m "Auto-update extra invoice manifest"
            git pull --rebase origin main
            git push
          else
            echo "manifest unchanged"
          fi
