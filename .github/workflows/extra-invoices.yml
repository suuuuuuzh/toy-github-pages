name: Update extra invoice manifest

on:
  push:
    branches: [main]
    paths:
      - "expense-report/invoices/extra/**"
      - "supernova/invoices/extra/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: extra-invoices-manifest
  cancel-in-progress: false

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install PyMuPDF (best-effort PDF metadata)
        run: pip install --quiet pymupdf || true
      - name: Regenerate invoice manifests
        run: |
          python3 expense-report/tools/gen_extra_manifest.py
          python3 supernova/tools/gen_extra_manifest.py
      - name: Commit manifests if changed
        run: |
          if ! git diff --quiet -- expense-report/invoices-extra.js supernova/invoices-extra.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add expense-report/invoices-extra.js supernova/invoices-extra.js
            git commit -m "Auto-update extra invoice manifest"
            git pull --rebase origin main
            git push
            # 机器人的提交不会自动触发 Pages 部署，这里主动请求一次重建
            curl -sS -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
          else
            echo "manifest unchanged"
          fi
